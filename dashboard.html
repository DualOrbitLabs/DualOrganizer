<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Registro de Sesiones</title>
  <link rel="stylesheet" href="./styles/navbar.css">
  <link rel="stylesheet" href="./styles/dashboard.css">
</head>

<body>
  <!-- Navbar global -->
  <nav class="navbar-global">
    <!-- Zona Izquierda: Logo + Nombre -->
    <a href="hub.html" class="navbar-brand">
      <img src="global/DOLFNBB.png" alt="Logo DualOrganizer" class="navbar-logo">
      <span class="navbar-title">DualOrganizer</span>
    </a>

    <!-- Zona Centro: Links de Navegación -->
    <ul class="navbar-nav">
      <li><a href="hub.html" class="nav-link">Hub</a></li>
      <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
      <li><a href="admin.html" class="nav-link">Administración</a></li>
    </ul>

    <!-- Zona Derecha: Acciones -->
    <div class="navbar-actions">
      <button id="btnExportCSV" class="btn-export">Exportar CSV</button>
      <a href="profile.html" class="btn-profile" title="Mi Perfil">👤</a>
    </div>
  </nav>

  <!-- Calendario colapsable -->
  <div class="calendar-wrapper" id="calendarWrapper">
    <div class="calendar-header">
      <h3>Agendas / Calendario</h3>
      <button id="btnToggleCalendar" class="btn-toggle-calendar">Ocultar</button>
    </div>
    <div class="calendar-content" id="calendarContent">
      <input type="date" id="dateFilter" title="Filtrar sesiones por fecha">
    </div>
  </div>

  <div class="main-container">
    <!-- Top info: Total de horas -->
    <div class="top-kpi-bar">
      <h2>Horas Acumuladas: <span id="kpiTotalHours">0</span></h2>
    </div>

    <!-- Calendario Semanal Principal -->
    <main class="calendar-main">
      <div class="calendar-header-controls">
        <button id="btnPrevWeek" class="btn-nav">&lt; Ant</button>
        <h3 id="currentWeekLabel">Semana actual</h3>
        <button id="btnNextWeek" class="btn-nav">Sig &gt;</button>
      </div>

      <!-- Cuadrícula del Calendario Semanal -->
      <div class="weekly-calendar-grid" id="weeklyCalendarGrid">
        <!-- Generado dinámicamente -->
      </div>
    </main>

    <!-- Modal para Registrar Sesión al hacer clic en el calendario -->
    <div id="sessionModal" class="modal" style="display: none;">
      <div class="modal-content">
        <span class="close-btn" id="closeModalBtn">&times;</span>
        <h2>Agendar Sesión</h2>
        <form id="sessionForm">
          <!-- Fecha seleccionada (solo lectura o pre-llenada) -->
          <div class="form-group">
            <label for="date">Fecha:</label>
            <input type="date" id="date" required readonly>
          </div>
          <div class="form-group">
            <label for="time">Hora de inicio:</label>
            <input type="time" id="time" required>
          </div>
          <div class="form-group">
            <label for="studentName">Alumno:</label>
            <input type="text" id="studentName" required>
          </div>
          <div class="form-group">
            <label for="subject">Materia:</label>
            <input type="text" id="subject" required>
          </div>
          <div class="form-group">
            <label for="hours">Duración (Horas):</label>
            <input type="number" id="hours" step="0.5" required>
          </div>
          <button type="submit" class="btn-primary">Guardar Sesión</button>
        </form>
      </div>
    </div>

    <!-- Guardado temporalmente (Oculto) 
    <div style="display: none;" id="hiddenLegacyContent">
      <div class="kpi-card">
        <h3>Total Sesiones</h3>
        <p id="kpiTotalSessions">0</p>
      </div>
      <table id="sessionsTable">
        <tbody id="sessionsTableBody"></tbody>
      </table>
    </div>

  </div>-->

    <script src="js/dashboard.js"></script>
</body>

</html>
